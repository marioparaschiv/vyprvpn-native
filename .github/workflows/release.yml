name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: VyprVPN-windows-x64.zip
          - os: macos-latest
            archive: VyprVPN-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask dist
      - name: Archive dist
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}
      - name: Archive VyprVPN.app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/VyprVPN.app ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" VyprVPN-*.zip --repo "$GITHUB_REPOSITORY" --title "VyprVPN $GITHUB_REF_NAME" --draft --notes ""
