[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
ipc = { path = "crates/ipc" }
vypr-api = { path = "crates/vypr-api" }
locations = { path = "crates/locations" }
placement = { path = "crates/placement" }
tunnel = { path = "crates/tunnel" }
env_logger = "0.11.11"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ed27c6293b585acc40c10be7138534243bee5841", features = ["gpui-fast"] }
interprocess = { version = "2.4.5", features = ["tokio"] }
log = "0.4.34"
md-5 = "0.11.0"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tray-icon = "0.26.1"
url = "2.5.8"
widestring = "1.2.1"
windows = "0.62.2"
windows-dpapi = "0.2.0"
windows-service = "0.8.1"
windows-sys = "0.61.2"
windows-version = "0.100.0"
wiremock = "0.6.5"
sha2 = "0.11.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.23.1"
getrandom = "0.4.3"
ipnet = "2.12.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"
# Kept on the libloading version wireguard-nt uses, since tunnel names its load error type.
libloading = "0.8.9"
wireguard-nt = "0.5.0"
boringtun = { version = "0.7.1", features = ["device"] }
winreg = "0.56.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
notify-rust = "4.18.2"
rustix = { version = "1.1.5", default-features = false, features = ["std"] }
winsafe = { version = "0.0.29", default-features = false }
objc2 = "0.6.5"
raw-window-handle = { version = "0.6.2", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
